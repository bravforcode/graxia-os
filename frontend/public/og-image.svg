<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Graxia OS — AI Store Builder & Funnel Automation">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle decorative shapes -->
  <circle cx="180" cy="120" r="160" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1040" cy="540" r="200" fill="#ffffff" opacity="0.08" filter="url(#soft)"/>
  <circle cx="980" cy="90" r="90" fill="#db2777" opacity="0.35" filter="url(#soft)"/>

  <!-- Center glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand mark -->
  <g transform="translate(600 250)" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1">Graxia OS</text>
    <text x="0" y="56" font-size="32" font-weight="400" fill="#ffffff" opacity="0.85" letter-spacing="0.5">AI Store Builder &amp; Funnel Automation</text>
  </g>

  <!-- Thin accent line -->
  <rect x="500" y="330" width="200" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
</svg>