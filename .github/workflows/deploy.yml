name: Build & Deploy — Graxia OS

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/graxia-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/graxia-frontend

jobs:
  # ─── Build Images ──────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Image Tag
        id: meta
        run: |
          TAG="${{ github.sha }}"
          SHORT_TAG="${TAG:0:7}"
          echo "tag=$SHORT_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_AGENT_STREAM_URL=${{ secrets.VITE_AGENT_STREAM_URL }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Save image tag
        run: echo "${{ steps.meta.outputs.tag }}" > image_tag.txt

      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt

  # ─── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    # Staging is defined in render.yaml, but this SSH workflow has no
    # repository convention for a Render service ID or deploy credential.
    # Keep staging out of this workflow until those target inputs exist.

    steps:
      - name: Download image tag
        uses: actions/download-artifact@v4
        with:
          name: image-tag

      - name: Set image tag
        id: tag
        run: echo "value=$(cat image_tag.txt)" >> $GITHUB_OUTPUT

      - name: Validate deployment inputs
        env:
          PROD_PATH: ${{ secrets.PROD_PATH }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in PROD_PATH PROD_HOST PROD_USER PROD_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "$name secret is required for production deploy."
              exit 1
            fi
          done

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          PROD_PATH: ${{ secrets.PROD_PATH }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || '22' }}
          timeout: 300s
          envs: PROD_PATH
          script: |
            set -euo pipefail
            if [ -z "${PROD_PATH:-}" ]; then
              echo "PROD_PATH is required."
              exit 1
            fi

            cd "$PROD_PATH"
            git fetch --prune origin main
            git checkout --detach "${{ github.sha }}"

            require_env_key() {
              local name="$1"
              if ! grep -Eq "^${name}=[^[:space:]]" .env.production; then
                echo "$name must be set in .env.production."
                exit 1
              fi
            }

            require_env_key CADDY_EMAIL
            require_env_key APP_HOST

            python3 backend/scripts/production_env_audit.py \
              --env-file .env.production \
              --compose-file config/docker-compose.production.yml \
              --frontend-env-file frontend/.env.production

            COMPOSE="docker compose -f config/docker-compose.production.yml --env-file .env.production"

            $COMPOSE config --quiet
            $COMPOSE up -d --wait postgres redis

            $COMPOSE build --pull backend frontend celery_worker celery_beat
            $COMPOSE run --rm --no-deps backend alembic upgrade head
            $COMPOSE up -d --remove-orphans --wait

            docker image prune -f --filter "until=24h"
            echo "Deploy complete: ${{ steps.tag.outputs.value }}"

      - name: Notify Success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "Discord webhook not configured; skipping success notification."
            exit 0
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{
              "username": "GitHub Actions",
              "embeds": [{
                "title": "Deploy Successful",
                "description": "Graxia OS production deploy complete",
                "color": 65280,
                "fields": [
                  {"name": "Commit", "value": "${{ github.sha }}", "inline": true},
                  {"name": "Actor", "value": "${{ github.actor }}", "inline": true}
                ]
              }]
            }' \
            "$DISCORD_WEBHOOK_URL"

      - name: Notify Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "Discord webhook not configured; skipping failure notification."
            exit 0
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{
              "username": "GitHub Actions",
              "embeds": [{
                "title": "Deploy FAILED",
                "description": "Graxia OS production deploy failed",
                "color": 16711680,
                "fields": [
                  {"name": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
                ]
              }]
            }' \
            "$DISCORD_WEBHOOK_URL"
