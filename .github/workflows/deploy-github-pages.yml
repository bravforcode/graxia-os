name: Deploy Graxia public site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /graxia/
          VITE_SITE_URL: https://bravforcode.github.io/graxia
          VITE_PUBLIC_FUNNEL_API_BASE_URL: https://kxundnceeuyjfittlgvo.supabase.co/functions/v1/graxia-funnel
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
