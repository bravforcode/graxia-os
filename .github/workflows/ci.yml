name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@288a8a8643a2c5a36b81d231c550dccfa0beeb64

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENCRYPTION_KEY: ci-test-encryption-key-not-for-production-32ch
      POSTGRES_PASSWORD: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      TRADING_MODE: PAPER
      TELEGRAM_BOT_TOKEN: ""
      MT5_LOGIN: "0"
      MT5_PASSWORD: ""
      MT5_SERVER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export OpenAPI spec
        run: python scripts/export_openapi.py --output openapi.json

      - name: Run backend tests
        run: python -m pytest tests -q --ignore=tests/test_api_routes.py --ignore=tests/test_tv_integration.py

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-openapi
          path: backend/openapi.json

  revenue_os:
    name: Revenue OS Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: graxia
          POSTGRES_PASSWORD: graxia
          POSTGRES_DB: revenue_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graxia -d revenue_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://graxia:graxia@localhost:5432/revenue_os_test
      APP_ENV: testing
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run Revenue OS tests
        run: python -m pytest graxia/packages/revenue_os/tests -q

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.6"

      - name: Install frontend dependencies
        run: bun install

      - name: Run frontend lint
        run: bun run lint

      - name: Run frontend tests
        run: bun run test

      - name: Run frontend build
        run: bun run build

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright dependencies (if cached)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run frontend browser E2E
        run: bun run test:e2e

      - name: Run Storybook build
        run: bun run build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-storybook
          path: frontend/storybook-static

      - name: Upload Playwright artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  ops:
    name: Ops Script Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate shell scripts
        run: |
          for f in scripts/ops/backup_database.sh scripts/ops/restore_database.sh scripts/ops/smoke_tests.sh deploy/scripts/harden-vps.sh deploy/scripts/deploy.sh deploy/scripts/rollback.sh deploy/scripts/dr-rebuild.sh; do
            if [ -f "$f" ]; then bash -n "$f"; else echo "SKIP: $f not found"; fi
          done

      - name: Validate Docker Compose
        run: TAG=${{ github.sha }} docker compose -f docker-compose.yml config > /dev/null

      - name: Validate production Docker Compose
        if: ${{ hashFiles('config/docker-compose.production.yml') != '' }}
        run: |
          cp .env.production.template .env.production
          mkdir -p secrets
          printf '%s' 'AGE-SECRET-KEY-placeholder' > secrets/backup_private_key.txt
          TAG=${{ github.sha }} docker compose -f config/docker-compose.production.yml --env-file .env.production config > /dev/null

  deploy:
    name: Build and Push Images
    needs: [security_scan, backend, revenue_os, frontend, ops]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate deploy inputs before image publication
        env:
          EXPECTED_REF: refs/heads/main
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          test "${GITHUB_REF}" = "${EXPECTED_REF}"
          test "${IMAGE_TAG}" = "$(git rev-parse HEAD)"
          printf '%s\n' "${IMAGE_TAG}" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "${IMAGE_REPOSITORY}" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/graxia-backend:${{ github.sha }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}/graxia-frontend:${{ github.sha }}
