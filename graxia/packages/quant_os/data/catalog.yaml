# ══════════════════════════════════════════════════════════════════════
# Quant OS — Data Catalog
# Centralized mapping: asset class → source → API → schedule → storage
# ══════════════════════════════════════════════════════════════════════
#
# Usage:
#   from catalog import get_assets_for_source, get_source_for_asset
#   from catalog import validate_catalog
#
# All paths are relative to project root (quant_os/)
# ══════════════════════════════════════════════════════════════════════

# ── FOREX ────────────────────────────────────────────────────────────

forex:
  pairs:
    # Majors
    - symbol: EURUSD
      sources:
        - provider: oanda
          instrument: EUR_USD
          schedule: "*/15 * * * *"   # every 15 min during market hours
          timeframes: [M15, H1, D1]
          storage: data/forex/{symbol}_{tf}.csv
        - provider: mt5
          timeframe: H1
          schedule: daily 05:00
          storage: data/{symbol}_H1.csv
        - provider: yfinance
          ticker: EURUSD=X
          schedule: daily 05:30
          storage: data/market/forex/daily/EURUSD.csv

    - symbol: GBPUSD
      sources:
        - provider: oanda
          instrument: GBP_USD
          schedule: "*/15 * * * *"
          timeframes: [M15, H1, D1]
          storage: data/forex/{symbol}_{tf}.csv
        - provider: mt5
          timeframe: H1
          schedule: daily 05:00
          storage: data/{symbol}_H1.csv

    - symbol: USDJPY
      sources:
        - provider: oanda
          instrument: USD_JPY
          schedule: "*/15 * * * *"
          timeframes: [M15, H1, D1]
          storage: data/forex/{symbol}_{tf}.csv
        - provider: mt5
          timeframe: H1
          schedule: daily 05:00
          storage: data/{symbol}_H1.csv

    - symbol: AUDUSD
      sources:
        - provider: oanda
          instrument: AUD_USD
          schedule: "*/15 * * * *"
          timeframes: [M15, H1, D1]
          storage: data/forex/{symbol}_{tf}.csv
        - provider: mt5
          timeframe: H1
          schedule: daily 05:00
          storage: data/{symbol}_H1.csv

    - symbol: USDCAD
      sources:
        - provider: oanda
          instrument: USD_CAD
          schedule: "*/15 * * * *"
          timeframes: [M15, H1, D1]
          storage: data/forex/{symbol}_{tf}.csv
        - provider: mt5
          timeframe: H1
          schedule: daily 05:00
          storage: data/{symbol}_H1.csv

    - symbol: USDCHF
      sources:
        - provider: oanda
          instrument: USD_CHF
          schedule: "*/15 * * * *"
          timeframes: [M15, H1, D1]
          storage: data/forex/{symbol}_{tf}.csv
        - provider: mt5
          timeframe: H1
          schedule: daily 05:00
          storage: data/{symbol}_H1.csv

    - symbol: NZDUSD
      sources:
        - provider: oanda
          instrument: NZD_USD
          schedule: "*/15 * * * *"
          timeframes: [M15, H1, D1]
          storage: data/forex/{symbol}_{tf}.csv
        - provider: mt5
          timeframe: H1
          schedule: daily 05:00
          storage: data/{symbol}_H1.csv

    # Crosses (yfinance only — not on Oanda practice)
    - symbol: EURGBP
      sources:
        - provider: yfinance
          ticker: EURGBP=X
          schedule: daily 05:30
          storage: data/market/forex/daily/EURGBP.csv
    - symbol: EURJPY
      sources:
        - provider: yfinance
          ticker: EURJPY=X
          schedule: daily 05:30
          storage: data/market/forex/daily/EURJPY.csv
    - symbol: GBPJPY
      sources:
        - provider: yfinance
          ticker: GBPJPY=X
          schedule: daily 05:30
          storage: data/market/forex/daily/GBPJPY.csv

