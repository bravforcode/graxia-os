# ── CRYPTO ───────────────────────────────────────────────────────────

crypto:
  symbols:
    - symbol: BTCUSD
      sources:
        - provider: binance
          pair: BTC/USDT
          schedule: "*/15 * * * *"
          timeframes: [M15, H1, D1]
          storage: data/crypto/{symbol}_{tf}.csv
        - provider: mt5
          timeframe: H1
          schedule: daily 05:00
          storage: data/{symbol}_H1.csv
        - provider: yfinance
          ticker: BTC-USD
          schedule: daily 06:00
          storage: data/market/crypto/daily/BTC.csv

    - symbol: ETHUSD
      sources:
        - provider: binance
          pair: ETH/USDT
          schedule: "*/15 * * * *"
          timeframes: [M15, H1, D1]
          storage: data/crypto/{symbol}_{tf}.csv
        - provider: mt5
          timeframe: H1
          schedule: daily 05:00
          storage: data/{symbol}_H1.csv
        - provider: yfinance
          ticker: ETH-USD
          schedule: daily 06:00
          storage: data/market/crypto/daily/ETH.csv

# ── MACRO DATA ───────────────────────────────────────────────────────

macro:
  fred_series:
    - series_id: DFII10
      description: "10-Year TIPS Yield (real yield)"
      schedule: daily 06:00
      storage: data/macro/{series_id}.parquet
    - series_id: VIXCLS
      description: "CBOE VIX"
      schedule: daily 06:00
      storage: data/macro/{series_id}.parquet
    - series_id: DCOILWTICO
      description: "WTI Crude Oil"
      schedule: daily 06:00
      storage: data/macro/{series_id}.parquet
    - series_id: GVZCLS
      description: "Gold VIX"
      schedule: daily 06:00
      storage: data/macro/{series_id}.parquet
    - series_id: T10YIE
      description: "10Y Breakeven Inflation"
      schedule: daily 06:00
      storage: data/macro/{series_id}.parquet
    - series_id: DGS10
      description: "10Y Treasury Rate"
      schedule: daily 06:00
      storage: data/macro/{series_id}.parquet
    - series_id: DTWEXBGS
      description: "Trade-Weighted USD Index"
      schedule: daily 06:00
      storage: data/macro/{series_id}.parquet
    - series_id: UNRATE
      description: "Unemployment Rate"
      schedule: monthly 08:00
      storage: data/macro/{series_id}.parquet
    - series_id: FEDFUNDS
      description: "Federal Funds Rate"
      schedule: monthly 08:00
      storage: data/macro/{series_id}.parquet

  yf_series:
    - ticker: "^VIX"
      alias: VIXCLS
      schedule: daily 06:00
      storage: data/macro/yf_VIXCLS.parquet
    - ticker: "^GVZ"
      alias: GVZCLS
      schedule: daily 06:00
      storage: data/macro/yf_GVZCLS.parquet
    - ticker: "DTWEXBGS"
      alias: DTWEXBGS
      schedule: daily 06:00
      storage: data/macro/yf_DTWEXBGS.parquet

# ── COT REPORTS ──────────────────────────────────────────────────────

cot:
  reports:
    - market: "088691"  # Gold
      name: XAUUSD
      report_type: disaggregated_fut
      schedule: weekly Friday 18:00
      storage: data/cot/cot_xauusd_disaggregated_fut_{year}.parquet

# ── ON-CHAIN (Crypto) ───────────────────────────────────────────────

onchain:
  providers:
    - name: glassnode
      api_key_env: GLASSNODE_API_KEY
      status: missing  # Need to configure
      metrics:
        - exchange_net_flow
        - active_addresses
        - hash_rate
        - nvt_ratio

    - name: cryptoquant
      api_key_env: CRYPTOQUANT_API_KEY
      status: missing
      metrics:
        - exchange_reserves
        - whale_transactions
        - miner_outflow

    - name: santiment
      api_key_env: SANTIMENT_API_KEY
      status: missing
      metrics:
        - social_volume
        - dev_activity
        - github_activity

  fear_greed:
    provider: alternative.me
    url: https://api.alternative.me/fng/
    schedule: "*/6 * * * *"  # every 6 hours
    storage: data/onchain/fear_greed.json

# ── NEWS SENTIMENT ───────────────────────────────────────────────────

news:
  provider: newsapi
  api_key_env: NEWS_API_KEY
  status: missing  # Need to configure
  queries:
    - gold trading
    - forex market
    - federal reserve
    - bitcoin cryptocurrency
    - stock market
    - inflation
    - interest rates
  schedule: "*/4 * * * *"  # every 4 hours
  storage_duckdb: news_sentiment table
  storage_chroma: ChromaDB news collection

# ── ORDER BOOK ───────────────────────────────────────────────────────

orderbook:
  provider: binance
  symbols:
    - BTC/USDT
    - ETH/USDT
  depth: 20
  schedule: "*/5 * * * *"  # every 5 minutes
  storage: data/orderbook/{symbol}_{timestamp}.json

# ── ALTERNATIVE DATA (Future) ────────────────────────────────────────

alternative:
  social:
    - provider: twitter
      api_key_env: TWITTER_API_KEY
      status: missing
      metrics: [sentiment, volume, engagement]

    - provider: reddit
      api_key_env: REDDIT_API_KEY
      status: missing
      metrics: [sentiment, volume]

  satellite:
    - provider: orbital_insight
      status: not_configured

  consumer:
    - provider: kavout
      status: not_configured

# ── STORAGE LOCATIONS ────────────────────────────────────────────────

storage:
  duckdb: data/market_data.duckdb
  duckdb_tables:
    - market_data       # OHLCV from all sources
    - macro_data        # FRED series
    - news_sentiment    # News + VADER/TextBlob scores
    - trades            # Paper/live trade logs
  chromadb: data_pipeline/storage/chroma_db/
  csv_root: data/
  parquet_root: data/
  tick_root: data/ticks/
  macro_root: data/macro/
  cot_root: data/cot/
  onchain_root: data/onchain/
